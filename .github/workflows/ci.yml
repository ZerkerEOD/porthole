name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: daemon/go.mod, cache-dependency-path: daemon/go.sum }
      - run: cd daemon && go vet ./... && go test ./...
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: relay/package-lock.json }
      - run: cd relay && npm ci && npm run typecheck && npm test
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        # Same Flutter as the Jenkins agents (the Mac mini pins 3.44.6); newer stables deprecate
        # package:flutter/material and turn the analyzer red on infos.
        with: { flutter-version: 3.44.6, channel: stable, cache: true }
      - run: cd app && flutter pub get && flutter analyze && flutter test
